# Alembic configuration for the RexCrop backend.
#
# The migration environment lives in alembic/env.py and reads the database
# URL from app.core.config, so DATABASE_URL here is only a fallback.

[alembic]
script_location = alembic
prepend_sys_path = .

# Template used for new revision files.
file_template = %%(rev)s_%%(slug)s

# Never render Python defaults into migrations; server defaults only.
render_as_batch = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
