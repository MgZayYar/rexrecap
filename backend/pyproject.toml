[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rexcrop-backend"
version = "0.1.0"
description = "RexCrop FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "bcrypt>=4.2,<5.0",
  "boto3>=1.34,<2.0",
  "email-validator>=2.2,<3.0",
  "faster-whisper>=1.1,<2.0",
  "fastapi>=0.115,<1.0",
  "opencv-python-headless>=4.8,<5.0",
  "openai>=1.0,<3.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "moto[s3]>=5.0,<6.0",
  "pytest>=8.0,<9.0",
]
