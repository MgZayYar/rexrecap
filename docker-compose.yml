# RexCrop production stack.
#
#   1. cp .env.example .env   # then set JWT_SECRET_KEY and friends
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# Object storage (MinIO) is optional: start it with
#   docker compose --profile storage up --build
# and set STORAGE_BACKEND=s3 in .env.

services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: "sqlite:////data/rexcrop.db"
      UPLOADS_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
    volumes:
      - rexcrop-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.runner"]
    env_file: .env
    environment:
      DATABASE_URL: "sqlite:////data/rexcrop.db"
      UPLOADS_DIR: /data/uploads
      OUTPUTS_DIR: /data/outputs
    volumes:
      - rexcrop-data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    env_file: .env
    environment:
      # Server-side proxy target for the backend API.
      API_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional S3-compatible object storage for job-output delivery.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rexcrop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rexcrop-minio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-rexcrop} $${MINIO_ROOT_PASSWORD:-rexcrop-minio-secret} &&
      mc mb -p local/rexcrop-outputs || true
      "

volumes:
  rexcrop-data:
  minio-data:
